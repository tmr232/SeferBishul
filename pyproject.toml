[project]
name = "sefer-bishul"
version = "0.1.0"
description = ""
authors = [{ name = "Tamir Bahar" }]
requires-python = ">=3.15, <3.16"
readme = "README.md"
license = "MIT"
dependencies = [
    "typer>=0.29.1",
    "jinja2>=3.1.6",
    "attrs>=26.1.0",
    "markdown-it-py>=4.3.0",
    "pillow>=13.0.0",
    "pyyaml>=6.0.3",
    "more-itertools>=11.2.1",
]


[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"


[project.scripts]
build-book = "sefer_bishul.ng:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "nox>=2026.10.20",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.mypy]
check_untyped_defs = true

[tool.pytest.ini_options]
xfail_strict = true
addopts = "-ra -q --cov --cov-report=xml --cov-report=term-missing"
testpaths = [
    "tests",
]

[tool.ruff.lint]
# Avoid automatic removal of unused variables
unfixable = ['F841'] # unused-variable

[tool.coverage]
report.skip_covered = true

[tool.scriv]
format = "md"
